<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
<title id="title">AsyncTicket HELD 예매 흐름 적용안</title>
<desc id="desc">짧은 트랜잭션으로 좌석을 선점한 뒤 DB 잠금 없이 결제를 기다리고, 확정 시 소유권과 만료를 다시 검사한다. 선점 해제와 주문 취소는 좌석과 한도를 복원하며 환불은 후처리한다. YES24의 내부 구현을 관찰한 그림이 아니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#557084"/></marker></defs>
<style>text{font-family:'Malgun Gothic','Noto Sans CJK KR',sans-serif;fill:#213b50}.title{font-size:29px;font-weight:700}.sub{font-size:17px;fill:#526b7b}.node-title{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:16px;fill:#526b7b}.line{fill:none;stroke:#557084;stroke-width:2.5;marker-end:url(#arrow)}.label{font-size:15px;fill:#526b7b}</style>
<rect width="1200" height="960" rx="18" fill="#f3f6fa"/>
<text x="48" y="54" class="title">우리 서비스 적용안 · HELD 예매 흐름</text>
<text x="48" y="86" class="sub">YES24 내부 구현의 관찰도가 아닙니다. 현재 v4 계약을 설명하는 설계 요약입니다.</text>

<rect x="56" y="128" width="505" height="94" rx="12" fill="#e1f0f1" stroke="#80aeb3" stroke-width="1.5"/>
<text x="76" y="158" class="node-title">1  탐색·좌석 선택</text>
<text x="76" y="185" class="body">공연·회차·좌석 조회 → 1~3개 선택</text>
<text x="76" y="209" class="body">선점 요청은 로그인 회원이 제출</text>
<rect x="56" y="246" width="505" height="94" rx="12" fill="#e1f0f1" stroke="#80aeb3" stroke-width="1.5"/>
<text x="76" y="276" class="node-title">2  POST /seat-holds</text>
<text x="76" y="303" class="body">잠금·판매/좌석/매수 검사 → HELD 저장</text>
<text x="76" y="327" class="body">ACTIVE·현재 포인터·held 집계 함께 COMMIT</text>
<rect x="56" y="364" width="505" height="94" rx="12" fill="#e1f0f1" stroke="#80aeb3" stroke-width="1.5"/>
<text x="76" y="394" class="node-title">3  결제 화면에서 대기</text>
<text x="76" y="421" class="body">선점 소유자와 만료 시각은 DB에 저장</text>
<text x="76" y="445" class="body">사용자 대기 중 DB 행 잠금 유지 안 함</text>
<rect x="56" y="482" width="505" height="94" rx="12" fill="#e1f0f1" stroke="#80aeb3" stroke-width="1.5"/>
<text x="76" y="512" class="node-title">4  POST /reservations</text>
<text x="76" y="539" class="body">잠금 후 본인·만료·현재 포인터 재검사</text>
<text x="76" y="563" class="body">유효한 선점만 로컬 mock 승인으로 진행</text>
<rect x="56" y="600" width="505" height="94" rx="12" fill="#e1f0f1" stroke="#80aeb3" stroke-width="1.5"/>
<text x="76" y="630" class="node-title">5  승인·주문 확정·발권</text>
<text x="76" y="657" class="body">CONSUMED · RESERVED · held → active</text>
<text x="76" y="681" class="body">주문·결제·티켓을 같은 TX로 COMMIT</text>
<rect x="56" y="718" width="505" height="94" rx="12" fill="#e1f0f1" stroke="#80aeb3" stroke-width="1.5"/>
<text x="76" y="748" class="node-title">6  본인 예매·티켓 조회</text>
<text x="76" y="775" class="body">화면 새로고침은 결과 GET</text>
<text x="76" y="799" class="body">원래 확정 키 재전송은 기존 주문 조회</text>
<path d="M308 222 V246" class="line"/>
<path d="M308 340 V364" class="line"/>
<path d="M308 458 V482" class="line"/>
<path d="M308 576 V600" class="line"/>
<path d="M308 694 V718" class="line"/>
<rect x="686" y="246" width="458" height="94" rx="12" fill="#fff0d7" stroke="#d5b16b" stroke-width="1.5"/>
<text x="706" y="276" class="node-title">좌석 경쟁·판매/한도 불가</text>
<text x="706" y="303" class="body">전체 실패 안내 후 최신 좌석 재조회</text>
<text x="706" y="327" class="body">다른 회원 선점의 소유권은 유지</text>
<rect x="686" y="364" width="458" height="94" rx="12" fill="#fff0d7" stroke="#d5b16b" stroke-width="1.5"/>
<text x="706" y="394" class="node-title">명시 해제 또는 만료 정리</text>
<text x="706" y="421" class="body">RELEASED / EXPIRED · AVAILABLE</text>
<text x="706" y="445" class="body">held 감소 / 현재 포인터 일치 좌석만 반환</text>
<rect x="686" y="482" width="458" height="94" rx="12" fill="#fff0d7" stroke="#d5b16b" stroke-width="1.5"/>
<text x="706" y="512" class="node-title">예상 mock 거절</text>
<text x="706" y="539" class="body">RELEASED · 좌석 반환 · held 감소</text>
<text x="706" y="563" class="body">COMMIT 후 422 / 성공 주문·티켓 없음</text>
<path d="M561 293 H686" class="line"/>
<path d="M561 411 H686" class="line"/>
<path d="M561 529 H686" class="line"/>
<rect x="686" y="670" width="458" height="142" rx="12" fill="#e7ecfa" stroke="#a0b0d9" stroke-width="1.5"/>
<text x="706" y="700" class="node-title">주문 전체 취소</text>
<text x="706" y="727" class="body">주문·티켓 CANCELED / 좌석 반환</text>
<text x="706" y="751" class="body">active 감소 → 예매 가능 매수 복원</text>
<text x="706" y="775" class="body">환불 PENDING · 결제 PAID</text>
<text x="706" y="799" class="body">별도 mock 처리 성공 → COMPLETED / REFUNDED</text>
<path d="M561 765 H686" class="line"/>
<rect x="48" y="846" width="1104" height="78" rx="10" fill="#fff" stroke="#d9e2ec"/>
<text x="68" y="875" class="small">예상 밖 DB 오류: 해당 TX 롤백. 이전에 커밋한 ACTIVE 선점은 남을 수 있습니다.</text>
<text x="68" y="901" class="small">180초·묶음 해제·가격 고정·회차 선행 잠금은 팀 검토용 제안입니다. 실제 구현·부하 시험 결과가 아닙니다.</text>
</svg>